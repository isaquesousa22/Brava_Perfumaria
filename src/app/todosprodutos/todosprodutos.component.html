  @for (produto of listaProdutos; track produto.id) {
    <div class="produto">
    <div class="img">
      <img  alt="Produto 1" src="{{produto.url}}" >
    </div>
    <h3 class="titleProduto" >{{produto.nome}}</h3>
    <p class="descricao"  ><strong>Descrição: {{produto.descricao}}</strong>  </p>
    <p>{{produto.preco}}</p>
    <input type="hidden" [value]="produto.id" />

    <button class="btn">Comprar</button>
    
    <button class="btn" (click)="adicionarAoCarrinho(produto.id)">carrinho</button>

  </div>
