<app-header></app-header>


<body>

    <div class=card>

        <div class="card-body">

            <div class="text">

                <h1>
                    Login de Cliente
                </h1>

                <p>
                    Coloque seus dados para entrar na Brava Perfumaria.
                </p>

            </div>

            <form class="space-y-4">



                <label class="form-control">

                    <span class="label-text">E-mail</span>

                    <input id="email" 
                    type="email"
                     class="input " 
                     placeholder="exemplo@email.com" 
                    [(ngModel)]="email"
                     name = "email"
                     required>

                </label>

                <label class="form-control">

                    <span class="label-text ">Senha</span>

                    <input id="senha" 
                    type="password" 
                    class="input " 
                    placeholder="••••••••" 
                    [(ngModel)]="senha"
                    name="senha"
                    required>

                </label>


                <div class="flex ">

                    <a class="btn"  (click)="logar()">Logar</a>

                    <a routerLink="/home" class="btn ">
                        Cancelar
                    </a>

                    
    


                </div>

                <div>

                    

                    <a class="link"  routerLink="/cadastro">Não tenho cadastro</a>
                    <br>

                    <a onclick="recuperarSenha(); return false;" class="link ">
                        Esqueci minha senha
                    </a>
                </div>


                <p id="mensagem"></p>

            </form>

        </div>

    </div>


</body>
