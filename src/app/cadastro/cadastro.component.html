<app-header>

</app-header>

<body>

    <div class=card>

        <div class="card-body">

            <div class="text">

                <h1>
                    Cadastro de Cliente
                </h1>

                <p>
                    Preencha seus dados para fazer parte da Brava perfumaria .
                </p>

            </div>

            <form class="space-y-4">

                <label class="form-control">

                    <span class="label-text mb-2">Nome</span>

                    <input id="nome" 
                    type="text" 
                    class="input input-bordered w-full" 
                    placeholder="Digite o seu nome "
                    [(ngModel)]="cliente.nome" 
                    name="nome" required>

                </label>

                <label class="form-control">

                    <span class="label-text ">Telefone</span>

                    <input id="telefone" 
                    type="tel" 
                    class="input" 
                    placeholder="(11) 99999-9999"
                    [(ngModel)]="cliente.telefone" 
                    name="telefone" required>

                </label>

                <label class="form-control">

                    <span class="label-text">Endereço</span>

                    <input id="endereco" 
                    type="text" 
                    class="input " 
                    placeholder="Rua, número e bairro"
                    [(ngModel)]="cliente.endereco" 
                    name="endereco" required>

                </label>

                <label class="form-control">

                    <span class="label-text">E-mail</span>

                    <input id="email" 
                    type="email" 
                    class="input " 
                    placeholder="exemplo@email.com"
                    [(ngModel)]="cliente.email" 
                    name="email" required>

                </label>



                <label class="form-control">

                    <span class="label-text ">CPF</span>

                    <input id="cpfCnpj"
                     type="text"
                    class="input "
                    placeholder="Digite seu CPF ou CNPJ"
                    [(ngModel)]="cliente.cpfCnpj"
                    name="cpfCnpj" required>

                </label>

                <label class="form-control">

                    <span class="label-text ">Senha</span>

                    <input 
                    id="senha" type="password"
                     class="input " 
                     placeholder="••••••••" 
                     [(ngModel)]="cliente.senha"
                     name="senha" required>

                </label>


                <label class="form-control">

                    <span class="label-text ">Confirma senha</span>

                    <input id="confirmarSenha" 
                    type="password" 
                    class="input " placeholder="••••••••"
                    [(ngModel)]="confirmarSenha" 
                    name="confirmarSenha" required>

                </label>


                <div class="flex ">

                    <a id="btnCadastrar" class="btn" (click)="salvar()"> Cadastrar </a>

                    <a routerLink="/login" class="btn"> Tenho Cadastro </a>

                    <a routerLink="/home" class="btn ">
                        Cancelar
                    </a>



                </div>

                <p id="mensagem"></p>

            </form>

        </div>

    </div>


</body>
