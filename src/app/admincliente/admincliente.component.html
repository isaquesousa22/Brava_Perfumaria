<div class="content-container">


    <div class="cabecalho">
        <div>
            <h1 class="subtitulo">
                ÁREA ADMINISTRATIVA
            </h1>


            <h1>Clientes</h1>
            <p>
                Gerencie os clientes cadastrados na plataforma.
            </p>
        </div>
     
          <a  routerLink="/Cadastro" type="button" class=" btn btn-secondary">
            + Novo cliente
         </a>

        <a routerLink= "/admin" class=" btn btn-secondary">
                voltar
         </a>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>email</th>
                    <th>endereco</th>
                    <th>cpf</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                @for (cliente of listaClientes; track cliente.id) {
                <tr>
                    <td>{{ cliente.id }}</td>
                    <td>{{ cliente.nome }}</td>
                    <td>{{ cliente.email }}</td>
                    <td>{{ cliente.endereco }}</td>
                    <td>{{ cliente.cpfCnpj }}</td>
                    <td class="acoes">
                        <button class="botao-editar" type="button" (click)="editar(cliente.id!)">
                            Editar
                        </button>
                        <button class="botao-excluir" type="button" (click)="excluir(cliente.id!)">
                            Excluir
                        </button>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
