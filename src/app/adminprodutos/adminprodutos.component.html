<div class="content-container">


    <div class="cabecalho">
        <div>
            <h1 class="subtitulo">
                ÁREA ADMINISTRATIVA
            </h1>


            <h1>Produtos</h1>
            <p>
                Gerencie os produtos cadastrados na plataforma.
            </p>
        </div>
     
          <a  routerLink="/cadastro-produtos" type="button" class=" btn btn-secondary">
            + Novo produto
         </a>

        <a routerLink= "/admin" class=" btn btn-secondary">
                voltar
         </a>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>quantidade</th>
                    <th>preço</th>
                    <th>descrição</th>
                    
                </tr>
            </thead>
            <tbody>
                @for (produto of listaProdutos; track produto.id) {
                <tr>
                    <td>{{ produto.id }}</td>
                    <td>{{ produto.nome }}</td>
                    <td>{{ produto.quantidade }}</td>
                    <td>{{ produto.preco }}</td>
                    <td>{{ produto.descricao }}</td>
                    
                    <td class="acoes">
                        <button class="btn btn-warning" (click)="editar(produto.id)">
                            Editar

                        </button>
                   
                        <button class="botao-excluir" type="button" (click)="excluir(produto.id!)">
                            Excluir
                        </button>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
